# Gemini Code Assist — repo review config
# https://developers.google.com/gemini-code-assist/docs/customize-repo-review
#
# Mention-only: gitty posts `/gemini review` when it wants a second opinion.
# Auto review on PR open stays off so connecting the GCP app does not spam every PR.

have_fun: false

code_review:
  disable: false
  comment_severity_threshold: HIGH
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: false
    include_drafts: false

ignore_patterns:
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/*.egg-info/**"
