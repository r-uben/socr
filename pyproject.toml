[project]
name = "socr"
version = "2.5.0"
description = "Multi-engine document OCR with cascading fallback"
authors = [
    {name = "Ruben Fernandez-Fuertes", email = "fernandezfuertesruben@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
keywords = ["ocr", "pdf", "document-processing", "nougat", "mistral", "gemini", "deepseek", "marker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich>=13.0.0",
    "click>=8.1.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    # Canonical OCR output contract: shared by every engine CLI. socr reuses its
    # readers (split_native_pages, path helpers) and metadata writers so it
    # consumes the engines' canonical output by construction, not ad-hoc parsing.
    "ocr-output-contract @ git+https://github.com/r-uben/ocr-output-contract@v0.1.3",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0", # image-based table localization on scanned pages
    "pylatexenc>=2.10",
]

[project.urls]
Homepage = "https://github.com/r-uben/socr"
Repository = "https://github.com/r-uben/socr"
Issues = "https://github.com/r-uben/socr/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    # Pinned exactly, not a floor. CI runs `uv run ruff format --check .`, which
    # resolves the newest matching release rather than uv.lock; ruff 0.16 began
    # formatting Python code blocks inside Markdown by default, so an untouched
    # docs file turned red overnight and blocked every open PR (see #102, #107).
    # A ruff upgrade should be a deliberate commit that fixes any new findings in
    # one place, not something that happens to `main` while nobody is looking.
    "ruff==0.16.0",
]
# OCR Engine CLIs — install individually based on needs
# NOTE: marker-ocr-cli requires pillow<11 while deepseek-ocr-cli requires pillow>=11.
# They cannot coexist. Install one or the other, not both.
deepseek = ["deepseek-ocr-cli>=0.1.0"]
nougat = ["nougat-ocr-cli>=0.1.2"]
gemini = ["gemini-ocr-cli>=0.2.0"]
mistral = ["mistral-ocr-cli>=0.1.0"]
# Convenience groups
local = ["deepseek-ocr-cli>=0.1.0", "nougat-ocr-cli>=0.1.2"]
cloud = ["gemini-ocr-cli>=0.2.0", "mistral-ocr-cli>=0.1.0"]
all = ["deepseek-ocr-cli>=0.1.0", "nougat-ocr-cli>=0.1.2", "gemini-ocr-cli>=0.2.0", "mistral-ocr-cli>=0.1.0"]

[project.scripts]
socr = "socr.cli:main"
socr-regenerate-p6-prechange = "socr.devtools.regenerate_p6_prechange:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the direct git reference to ocr-output-contract above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/socr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# review/html.py embeds a CSS/JS template as a raw string. Wrapping those lines to 100
# chars would hurt the readability of the generated page, not the Python.
"src/socr/review/html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Ensure pytest resolves the local src/ tree before any editable-install .pth
# pointer, so worktree builds pick up local changes without a PYTHONPATH override.
pythonpath = ["src"]
