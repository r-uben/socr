name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: review runs once per PR (open/reopen/ready), not on every
    # push, to avoid draining the Claude subscription quota on each commit.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # TEMPORARY (2026-08-10) — diagnostic only, revert once the cause is known.
          # claude-review has failed on every PR (#126, #128, #129, #130) with
          # is_error:true after 274ms, 1 turn, $0.00 — it never reaches the API.
          # The credential IS present (CLAUDE_CODE_OAUTH_TOKEN is masked in the log,
          # not empty) and the marketplace/plugin install cleanly, so the failure is
          # at the auth/quota door. The action redacts the SDK result string by
          # default, which is the one field naming the cause. This unhides it.
          # NOTE: this repo is public, so Claude's output lands in public Actions
          # logs while this line is present. Remove it as soon as the error is read.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

