name: CI

on:
  push:
    branches: [main]
  # No branch filter: this trigger filters on the BASE branch, so a stacked PR
  # based on its predecessor rather than on main silently ran no jobs at all --
  # reviewed by people, executed by nobody. Every PR now self-verifies.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (advisory)
        run: uv run ruff check .
        continue-on-error: true
      - name: Format check
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -m "not integration" -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Type check (advisory)
        run: uv run mypy src/socr/ --ignore-missing-imports
        continue-on-error: true
